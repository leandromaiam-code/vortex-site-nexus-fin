type Variant = "primary" | "secondary" | "outline";

const styles: Record<Variant, string> = {
  primary:
    "bg-gradient-to-r from-[#6C5CE7] via-[#7C6CFF] to-[#00D2D3] text-white shadow-[0_0_0_1px_rgba(255,255,255,0.12),0_20px_60px_-20px_rgba(108,92,231,0.75)] hover:opacity-95",
  secondary:
    "bg-white/10 text-white shadow-[0_0_0_1px_rgba(255,255,255,0.12)] hover:bg-white/15",
  outline:
    "bg-transparent text-white border border-white/15 hover:border-white/25 hover:bg-white/5",
};


  as = "button",
  href,
  onClick,
  children,
  variant = "primary",
  size = "md",
  className,
  ariaLabel,
  eventName,
}: {
  as?: "button" | "link";
  href?: string;
  onClick?: () => void;
  children: React.ReactNode;
  variant?: Variant;
  size?: "sm" | "md" | "lg";
  className?: string;
  ariaLabel?: string;
  eventName?: string;
}) {
  const base =
    "inline-flex items-center justify-center gap-2 rounded-xl font-semibold transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#00D2D3]/70 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0A0A23]";
  const sizes =
    size === "sm"
      ? "px-3 py-2 text-sm"
      : size === "lg"
        ? "px-6 py-3.5 text-base"
        : "px-4 py-2.5 text-sm md:text-base";

  const cls = cn(base, sizes, styles[variant], className);

  if (as === "link" && href) {
    return (
      <Link
        href={href}
        class={cls}
        aria-label={ariaLabel}
        onClick={() => {
          trackCtaClick(eventName || "cta_click", { href, variant });
          onClick?.();
        }}
      >
        {children}
      </Link>
    );

  return (
    <button
      class={cls}
      aria-label={ariaLabel}
      onClick={() => {
        trackCtaClick(eventName || "cta_click", { variant });
        onClick?.();
      }}
      type="button"
    >
      {children}
    </button>
  );
}

type Props = {
  source: string; // page identifier
  buttonLabel?: string;
};


  const [email, setEmail] = React.useState("");
  const [country, setCountry] = React.useState<string>("US");
  const [loading, setLoading] = React.useState(false);
  const [status, setStatus] = React.useState<"idle" | "ok" | "error">("idle");
  const [message, setMessage] = React.useState<string>("");

  async function submit(e: React.FormEvent) {
    e.preventDefault();
    setStatus("idle");
    setMessage("");

    const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
    const anonKey = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;

    if (!supabaseUrl || !anonKey) {
      setStatus("error");
      setMessage("Missing Supabase env vars. Please configure NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY.");
      return;

    if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
      setStatus("error");
      setMessage("Please enter a valid email.");
      return;
    }

    setLoading(true);
    try {
      const res = await fetch(`${supabaseUrl}/rest/v1/waitlist`, {
        method: "POST",
        headers: {
          apikey: anonKey,
          Authorization: `Bearer ${anonKey}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
        body: JSON.stringify([
          {
            email,
            country,
            source,
            created_at: new Date().toISOString(),
            user_agent: typeof navigator !== "undefined" ? navigator.userAgent : null,
            referrer: typeof document !== "undefined" ? document.referrer : null,
            utm_source: getParam("utm_source"),
            utm_medium: getParam("utm_medium"),
            utm_campaign: getParam("utm_campaign"),
            utm_term: getParam("utm_term"),
            utm_content: getParam("utm_content"),
          },
        ]),
      });

      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt || "Request failed");
      }

      setStatus("ok");
      setMessage("You're on the list. We'll email you early access.");
      trackWaitlistSignup({ source, country });
      setEmail("");
    } catch (err: any) {
      setStatus("error");
      setMessage("Something went wrong. Try again in a moment.");
      // Optional: console for debugging
      console.error(err);
    } finally {
      setLoading(false);
    }
  }

  return (
    <form onSubmit={submit} class="w-full">
      <div class="grid gap-3 md:grid-cols-[1fr_140px_190px]">
        <label class="sr-only" htmlFor=email-${source}>
          Email
        </label>
        <input
          id=email-${source}
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="you@email.com"
          inputMode="email"
          autoComplete="email"
          class="h-12 w-full rounded-xl bg-white/5 px-4 text-sm text-white placeholder:text-white/40 ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-[#00D2D3]/60"
          aria-label="Email address"
        />

        <label class="sr-only" htmlFor=country-${source}>
          Country
        </label>
        <select
          id=country-${source}
          value={country}
          onChange={(e) => setCountry(e.target.value)}
          class="h-12 w-full rounded-xl bg-white/5 px-3 text-sm text-white ring-1 ring-white/10 focus:outline-none focus:ring-2 focus:ring-[#00D2D3]/60"
          aria-label="Country"
        >
          <option value="US">US</option>
          <option value="UK">UK</option>
        </select>

        <Button
          as="button"
          variant="primary"
          size="md"
          class="h-12"
          ariaLabel={buttonLabel}
          eventName="cta_click_waitlist"
          onClick={() => {}}
        >
          {loading ? "Joining..." : buttonLabel}
        </Button>
      </div>

      <p class="mt-3 text-xs text-white/60">
        No spam. Early access + launch perks. By joining, you agree to receive product updates.
      </p>

      {status !== "idle" ? (
        <div
          class=mt-3 rounded-xl border px-4 py-3 text-sm ${
            status === "ok"
              ? "border-emerald-400/20 bg-emerald-400/10 text-emerald-100"
              : "border-rose-400/20 bg-rose-400/10 text-rose-100"
          }
          role="status"
          aria-live="polite"
        >
          {message}
        </div>
      ) : null}
    </form>
  );
}

function getParam(key: string) {
  if (typeof window === "undefined") return null;
  const v = new URLSearchParams(window.location.search).get(key);
  return v ? v : null;
}

type TrackPayload = Record<string, any>;

declare global {
  interface Window {
    dataLayer?: any[];
    gtag?: (...args: any[]) => void;

}


  if (typeof window === "undefined") return;

  // GA4
  if (typeof window.gtag === "function") {
    window.gtag("event", event, payload);
  }

  // GTM
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event, ...payload });
}

export function trackWaitlistSignup(payload: TrackPayload = {}) {
  track("waitlist_signup", payload);
}

export function trackCtaClick(eventName = "cta_click", payload: TrackPayload = {}) {
  track(eventName, payload);
}

export function trackScrollDepth(depth: number) {
  track("page_scroll_depth", { depth });
}

"use client";





  React.useEffect(() => {
    const marks = new Set<number>();
    const depths = [25, 50, 75, 90];

    function onScroll() {
      const doc = document.documentElement;
      const scrollTop = window.scrollY || doc.scrollTop;
      const height = doc.scrollHeight - doc.clientHeight;
      if (height <= 0) return;
      const pct = Math.round((scrollTop / height) * 100);

      for (const d of depths) {
        if (pct >= d && !marks.has(d)) {
          marks.add(d);
          trackScrollDepth(d);

      }
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return null;
}

export function OrganizationJsonLd() {
  const siteUrl = process.env.NEXT_PUBLIC_SITE_URL || "https://knexo.com";
  const json = {
    "@context": "https://schema.org",
    "@type": "Organization",
    name: "kNexo",
    url: siteUrl,
    logo: `${siteUrl}/og/knexo-og.png`,
    sameAs: [],
  };
  return <script type="application/ld+json" dangerouslySetInnerHTML={{ __html: JSON.stringify(json) }} />;
}

export function ProductJsonLd({ name, description }: { name: string; description: string }) {
  const siteUrl = process.env.NEXT_PUBLIC_SITE_URL || "https://knexo.com";
  const json = {
    "@context": "https://schema.org",
    "@type": "Product",
    name,
    description,
    brand: { "@type": "Brand", name: "kNexo" },
    url: siteUrl,
    category: "Personal Finance Software",
  };
  return <script type="application/ld+json" dangerouslySetInnerHTML={{ __html: JSON.stringify(json) }} />;
}

export function FaqJsonLd({
  faqs,
}: {
  faqs: Array<{ question: string; answer: string }>;
}) {
  const json = {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    mainEntity: faqs.map((f) => ({
      "@type": "Question",
      name: f.question,
      acceptedAnswer: { "@type": "Answer", text: f.answer },
    })),
  };
  return <script type="application/ld+json" dangerouslySetInnerHTML={{ __html: JSON.stringify(json) }} />;
}
